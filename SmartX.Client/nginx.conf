server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly SPA — deep links (/mesh, /commands, …)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(dll|wasm|dat|blat|json|js|css|woff2?)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
    }
}
